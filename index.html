<script>
"use strict";
// ============================================================
// Lighthouse Keeper — core simulation (pure logic, no DOM)
// 原创光路解谜核心：光束传播 / 拍时序 / 船只航道 / 暗礁显形
// ============================================================
var LK = (function () {
  "use strict";
  var COLS = 13, ROWS = 9, CELL = 38;
  var BEAT = 3.0;            // 每拍 3 秒
  var BASE_RANGE = 7.5;      // 基础光束射程（格）
  var STEP = 0.15;           // 光线步进（格）
  var RAD1 = 0.62;           // 强度1 显形半径
  var REVEAL_NEED = 1.0;     // 累计受光 1 秒显形
  var DECAY = 0.7;           // 未受光时曝光衰减
  var WINDOW = 5.0;          // 显形保持窗口（秒）
  var SINK_D = 0.45;         // 撞礁判定距离
  var PROBE = 0.85;          // 船只前瞻距离
  var PROBE_D = 0.65;        // 前瞻触发距离
  var DODGE_OFF = 0.9;       // 侧移量

  function deg2rad(d) { return d * Math.PI / 180; }
  function norm(a) { a %= 360; if (a < 0) a += 360; return a; }
  function snap15(a) { return norm(Math.round(a / 15) * 15); }
  function dist(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }

  // ---------- 关卡数据（25 关，参考解内联） ----------
  // ship: {a:[c,r], b:[c,r], sp:格/拍, dv:侧避方向}  reef:{c:[[c,r]..], n:边缘擦碰}
  var LEVELS = [
/*00*/{ n:"First Light", beats:19, ships:[{a:[1,4],b:[12,4],sp:0.7,dv:1}],
  reefs:[{c:[[6,4]]}], sol:[{b:4,ang:0}] },
/*01*/{ n:"Twin Shoals", beats:20, ships:[{a:[1,4],b:[12,4],sp:0.6,dv:1}],
  reefs:[{c:[[5,4]]},{c:[[7,4]]}], sol:[{b:3,ang:0}] },
/*02*/{ n:"Northbound", beats:20, ships:[{a:[1,2],b:[12,2],sp:0.7,dv:1}],
  reefs:[{c:[[7,2]]}], sol:[{b:4,ang:-15}] },
/*03*/{ n:"Two Lanes", beats:24, ships:[{a:[1,2],b:[12,2],sp:0.7,dv:1},{a:[1,6],b:[12,6],sp:0.6,dv:-1}],
  reefs:[{c:[[6,2]]},{c:[[7,6]]}], sol:[{b:0,ang:-15},{b:8,ang:15}] },
/*04*/{ n:"Diagonal Run", beats:20, ships:[{a:[1,1],b:[9,9],sp:0.7,dv:1}],
  reefs:[{c:[[5,5]]}], sol:[{b:4,ang:15}] },
/*05*/{ n:"Cross Currents", beats:24, ships:[{a:[1,4],b:[12,4],sp:0.6,dv:1},{a:[1,2],b:[12,2],sp:0.6,dv:-1}],
  reefs:[{c:[[6,4]]},{c:[[7,2]]}], sol:[{b:0,ang:0},{b:8,ang:-15}] },
/*06*/{ n:"Tight Schedule", beats:24, ships:[{a:[1,4],b:[12,4],sp:0.6,dv:1},{a:[1,2],b:[12,2],sp:0.7,dv:-1},{a:[1,6],b:[12,6],sp:0.6,dv:-1}],
  reefs:[{c:[[5,4]]},{c:[[7,2]]},{c:[[7,6]]}], sol:[{b:0,ang:0},{b:7,ang:-15},{b:8,ang:15}] },
/*07*/{ n:"The Split", beats:24, ships:[{a:[1,4],b:[12,4],sp:0.6,dv:1},{a:[5,1],b:[5,8],sp:0.6,dv:1}],
  reefs:[{c:[[2,4]]},{c:[[5,6]]}],
  slots:[[3,4]], dev:["P"], sol:[{b:0,ang:0,put:[0,0]}] },
/*08*/{ n:"Prism Watch", beats:26, ships:[{a:[1,2],b:[12,2],sp:0.6,dv:-1},{a:[5,0],b:[5,8],sp:0.6,dv:1}],
  reefs:[{c:[[6,2]]},{c:[[5,6]]}],
  slots:[[3,4]], dev:["P"], sol:[{b:0,ang:-15},{b:8,ang:0,put:[0,0]}] },
/*09*/{ n:"Triple Beam", beats:26, ships:[{a:[1,2],b:[12,2],sp:0.6,dv:-1},{a:[1,6],b:[12,6],sp:0.6,dv:1},{a:[6,1],b:[6,8],sp:0.7,dv:1}],
  reefs:[{c:[[5,2]]},{c:[[5,6]]},{c:[[6,7]]},{c:[[7,2]]}],
  slots:[[3,4]], dev:["P"], sol:[{b:0,ang:0,put:[0,0]},{b:8,ang:-15}] },
/*10*/{ n:"Far Water", beats:20, ships:[{a:[1,4],b:[12,4],sp:0.6,dv:1}],
  reefs:[{c:[[9,4]]}],
  slots:[[4,4]], dev:["L"], sol:[{b:0,ang:0},{b:9,put:[0,0]}] },
/*11*/{ n:"Long Reach", beats:22, ships:[{a:[1,2],b:[12,2],sp:0.6,dv:1}],
  reefs:[{c:[[9,2]]}],
  slots:[[3,3]], dev:["L"], sol:[{b:0,ang:-15},{b:9,put:[0,0]}] },
/*12*/{ n:"Glass Work", beats:26, ships:[{a:[1,4],b:[12,4],sp:0.6,dv:1},{a:[1,2],b:[12,2],sp:0.6,dv:-1}],
  reefs:[{c:[[9,4]]},{c:[[6,2]]}],
  slots:[[4,4]], dev:["L"], sol:[{b:0,ang:-15},{b:8,ang:0,put:[0,0]}] },
/*13*/{ n:"Fog Bank", beats:22, ships:[{a:[1,3],b:[12,3],sp:0.6,dv:1}],
  reefs:[{c:[[5,3]]}], fog:[[4,2,3,5]],
  slots:[[3,3]], dev:["L"], sol:[{b:0,ang:-15},{b:5,put:[0,0]}] },
/*14*/{ n:"Through the Mist", beats:26, ships:[{a:[1,4],b:[12,4],sp:0.6,dv:1}],
  reefs:[{c:[[5,4]]},{c:[[9,4]]}], fog:[[4,3,3,3]],
  slots:[[3,4]], dev:["L"], sol:[{b:0,ang:0},{b:6,put:[0,0]}] },
/*15*/{ n:"Split and Reach", beats:24, ships:[{a:[1,0],b:[12,0],sp:0.6,dv:1},{a:[1,8],b:[12,8],sp:0.6,dv:-1},{a:[1,4],b:[12,4],sp:0.7,dv:1}],
  reefs:[{c:[[7,0]]},{c:[[7,8]]},{c:[[2,4]]}],
  slots:[[3,4]], dev:["P"], sol:[{b:0,ang:0,put:[0,0]}] },
/*16*/{ n:"Narrow Escape", beats:19, ships:[{a:[1,4],b:[12,4],sp:0.7,dv:1}],
  reefs:[{c:[[6,4]],n:1},{c:[[9,4]],n:1}],
  slots:[[4,4]], dev:["L"], sol:[{b:0,ang:0,put:[0,0]}] },
/*17*/{ n:"Reef Maze", beats:20, ships:[{a:[1,1],b:[9,9],sp:0.7,dv:1}],
  reefs:[{c:[[3,3]]},{c:[[5,5]]},{c:[[6,6]]}], sol:[{b:0,ang:-15},{b:6,ang:15}] },
/*18*/{ n:"Moving Targets", beats:22, ships:[{a:[1,2],b:[12,2],sp:0.75,dv:1},{a:[1,4],b:[12,4],sp:0.6,dv:1},{a:[1,6],b:[12,6],sp:0.7,dv:-1}],
  reefs:[{c:[[6,2]]},{c:[[7,4]]},{c:[[6,6]]}], sol:[{b:0,ang:-15},{b:6,ang:15},{b:8,ang:0}] },
/*19*/{ n:"Fog Line", beats:22, ships:[{a:[1,4],b:[12,4],sp:0.7,dv:1},{a:[1,2],b:[12,2],sp:0.6,dv:1}],
  reefs:[{c:[[8,4]]},{c:[[7,2]]}], fog:[[6,3,2,3]],
  slots:[[4,4]], dev:["L"], sol:[{b:0,ang:-15},{b:9,ang:0,put:[0,0]}] },
/*20*/{ n:"Twin Prisms", beats:22, ships:[{a:[1,4],b:[12,4],sp:0.6,dv:1},{a:[1,2],b:[12,2],sp:0.6,dv:-1},{a:[1,6],b:[12,6],sp:0.6,dv:-1}],
  reefs:[{c:[[2,4]]},{c:[[5,2]]},{c:[[7,6]]}],
  slots:[[3,4],[5,6]], dev:["P","P"], sol:[{b:0,ang:0,put:[0,0]},{b:8,put:[1,1]}] },
/*21*/{ n:"Storm Watch", beats:22, ships:[{a:[1,1],b:[9,9],sp:0.6,dv:1},{a:[1,9],b:[9,1],sp:0.6,dv:-1}],
  reefs:[{c:[[5,5]]},{c:[[8,2]]}],
  slots:[[3,3]], dev:["L"], sol:[{b:0,ang:15},{b:9,ang:-15,put:[0,0]}] },
/*22*/{ n:"Deep Fog", beats:22, ships:[{a:[1,4],b:[12,4],sp:0.6,dv:1},{a:[1,6],b:[12,6],sp:0.6,dv:-1}],
  reefs:[{c:[[6,4]]},{c:[[7,6]]}], fog:[[4,3,4,4]],
  sol:[{b:0,ang:0},{b:8,ang:15}] },
/*23*/{ n:"The Gauntlet", beats:22, ships:[{a:[1,2],b:[12,2],sp:0.7,dv:-1},{a:[1,6],b:[12,6],sp:0.6,dv:1},{a:[1,4],b:[12,4],sp:0.6,dv:1}],
  reefs:[{c:[[5,2]]},{c:[[7,2]]},{c:[[5,6]]},{c:[[2,4]]}],
  slots:[[3,4]], dev:["P"], sol:[{b:0,ang:0,put:[0,0]},{b:7,ang:-15}] },
/*24*/{ n:"Last Convoy", beats:22, ships:[{a:[1,2],b:[12,2],sp:0.6,dv:-1},{a:[1,6],b:[12,6],sp:0.6,dv:1},{a:[1,4],b:[12,4],sp:0.6,dv:1}],
  reefs:[{c:[[5,2]]},{c:[[7,2]]},{c:[[5,6]],n:1},{c:[[2,4]]}],
  slots:[[3,4]], dev:["P"], fog:[[10,3,2,3]],
  sol:[{b:0,ang:0,put:[0,0]},{b:8,ang:-15}] }
  ];

  // ---------- 关卡状态构建 ----------
  function mkState(li) {
    var L = LEVELS[li];
    var st = {
      li: li, L: L, t: 0, beat: 0, angle: 90, status: "play",
      lh: L.lh || [0, 4],
      angle0: (L.lh ? L.lh[0] : 0),
      tray: [], solq: L.sol.slice().sort(function (a, b) { return a.b - b.b; }), soli: 0,
      events: [], beams: []
    };
    var devList = L.dev || [];
    for (var i = 0; i < devList.length; i++) st.tray.push({ id: i, type: devList[i], slot: -1 });
    st.clusters = [];
    (L.reefs || []).forEach(function (rf) {
      st.clusters.push({ cells: rf.c.map(function (p) { return { c: p[0], r: p[1] }; }), narrow: !!rf.n, exposure: 0, revealed: false, win: 0, litNow: false, ripple: 0 });
    });
    st.ships = [];
    (L.ships || []).forEach(function (sh) {
      var A = sh.a, B = sh.b;
      var dx = B[0] - A[0], dy = B[1] - A[1];
      var len = Math.sqrt(dx * dx + dy * dy);
      st.ships.push({
        A: A, B: B, dir: [dx / len, dy / len], perp: [-dy / len, dx / len], len: len,
        sp: sh.sp / BEAT, hull: 2, docked: false, dockT: 0, dead: false,
        off: 0, offT: 0, dgi: -1, grazed: false, wake: []
      });
    });
    return st;
  }

  function devAt(st, slotIdx) {
    for (var i = 0; i < st.tray.length; i++) if (st.tray[i].slot === slotIdx) return st.tray[i];
    return null;
  }

  function setAngle(st, deg) { st.angle = snap15(deg); }

  function placeDevice(st, devIdx, slotIdx) {
    var d = st.tray[devIdx];
    if (!d) return;
    if (slotIdx >= 0) {
      var occ = devAt(st, slotIdx);
      if (occ && occ !== d) return; // 槽位已被占
    }
    d.slot = slotIdx;
  }

  // ---------- 光束传播（步进射线，遇棱镜分光/透镜增程/雾衰减） ----------
  function inFog(st, x, y) {
    var f = st.L.fog || [];
    for (var i = 0; i < f.length; i++) {
      var g = f[i];
      if (x >= g[0] && x < g[0] + g[2] && y >= g[1] && y < g[1] + g[3]) return true;
    }
    return false;
  }
  function deviceAtPoint(st, x, y, type, skipDev) {
    var slots = st.L.slots || [];
    for (var s = 0; s < slots.length; s++) {
      var d = devAt(st, s);
      if (!d || d.type !== type || d === skipDev) continue;
      var cx = slots[s][0] + 0.5, cy = slots[s][1] + 0.5;
      if (dist(x, y, cx, cy) < 0.35) return { dev: d, x: cx, y: cy };
    }
    return null;
  }

  function traceBeams(st) {
    var beams = [];
    var ox = st.lh[0] + 0.5, oy = st.lh[1] + 0.5;
    var queue = [{ x: ox, y: oy, a: st.angle, rng: BASE_RANGE, inten: 1, depth: 0 }];
    var guard = 0;
    while (queue.length && beams.length < 6 && guard++ < 24) {
      var bm = queue.shift();
      var dx = Math.cos(deg2rad(bm.a)), dy = Math.sin(deg2rad(bm.a));
      var x = bm.x, y = bm.y, d = 0, inten = bm.inten, pts = [];
      var lensUsed = null, fogNow = false;
      while (d < bm.rng && beams.length + queue.length < 7) {
        x += dx * STEP; y += dy * STEP; d += STEP;
        if (x < -0.5 || x > COLS + 0.5 || y < -0.5 || y > ROWS + 0.5) break;
        fogNow = inFog(st, x, y);
        // 透镜：增程提强度（每束只吃一次同一透镜）
        var le = deviceAtPoint(st, x, y, "L", null);
        if (le && le.dev !== lensUsed && bm.depth < 4) {
          lensUsed = le.dev;
          inten = Math.min(2, inten + 1);
          bm.rng = d + BASE_RANGE + 2.0;
        }
        pts.push({ x: x, y: y, i: inten * (fogNow ? 0.4 : 1) });
        // 棱镜：截断并分出 ±45° 两束
        var pr = deviceAtPoint(st, x, y, "P", null);
        if (pr && d > 0.3 && bm.depth < 3) {
          queue.push({ x: pr.x, y: pr.y, a: norm(bm.a + 45), rng: BASE_RANGE, inten: inten, depth: bm.depth + 1, skip: pr.dev });
          queue.push({ x: pr.x, y: pr.y, a: norm(bm.a - 45), rng: BASE_RANGE, inten: inten, depth: bm.depth + 1, skip: pr.dev });
          break;
        }
      }
      beams.push({ pts: pts, inten: inten, a: bm.a, ox: bm.x, oy: bm.y });
    }
    return beams;
  }

  // 光束扫过的显形判定：任一点落在显形半径内 → 簇受光
  function litClusters(st, beams) {
    var lit = [];
    for (var ci = 0; ci < st.clusters.length; ci++) {
      var cl = st.clusters[ci], hit = 0;
      for (var bi = 0; bi < beams.length && !hit; bi++) {
        var pts = beams[bi].pts;
        for (var pi = 0; pi < pts.length; pi++) {
          var p = pts[pi];
          if (p.i < 0.3) continue;
          for (var k = 0; k < cl.cells.length; k++) {
            var cc = cl.cells[k];
            if (dist(p.x, p.y, cc.c + 0.5, cc.r + 0.5) <= RAD1 * p.i) { hit = 1; break; }
          }
          if (hit) break;
        }
      }
      lit.push(hit ? 1 : 0);
    }
    return lit;
  }

  // 船只位置（确定性与拍时序一致）：s = t * sp（格/秒 = 格/拍 ÷ 3）
  function shipS(sh, t) { return Math.max(0, Math.min(sh.len, t * sh.sp)); }
  function shipXY(sh, t) {
    var s = shipS(sh, t);
    return { x: sh.A[0] + 0.5 + sh.dir[0] * s + sh.perp[0] * sh.off,
             y: sh.A[1] + 0.5 + sh.dir[1] * s + sh.perp[1] * sh.off, s: s };
  }

  function clusterNear(st, x, y, d) {
    for (var ci = 0; ci < st.clusters.length; ci++) {
      var cl = st.clusters[ci];
      for (var k = 0; k < cl.cells.length; k++) {
        var cc = cl.cells[k];
        if (dist(x, y, cc.c + 0.5, cc.r + 0.5) <= d) return ci;
      }
    }
    return -1;
  }

  // ---------- 主步进 ----------
  function step(st, dt) {
    if (st.status !== "play") return;
    st.t += dt;
    var nb = Math.floor(st.t / BEAT);
    if (nb !== st.beat) st.beat = nb;
    // 拍点应用参考操作时序（回放与玩家输入同路径；b:0 在首步即生效）
    while (st.soli < st.solq.length && st.solq[st.soli].b <= st.beat) {
      var e = st.solq[st.soli++];
      if (e.ang !== undefined) setAngle(st, e.ang);

// ---------- 游戏状态 ----------

// ---------- 输入 ----------
function evtPos(e) {
  var rect = canvas.getBoundingClientRect();

  var cy = (e.touches ? e.touches[0].clientY : e.clientY);

}
function gridAt(pt) { return { c: (pt.x - OX) / CELL, r: (pt.y - OY) / CELL }; }

    if (Math.hypot(g.c - (slots[s][0] + 0.5), g.r - (slots[s][1] + 0.5)) < 0.55) return s;

  var x = 26, tw = 54;

    var d = st.tray[j];

    var ev = st.events[i];

    } else if (ev.t === "sink") { sfx("sink"); shake = 0.6; }

  }

  c.arcTo(x + w, y + h, x, y + h, rad);

      var w0 = 13 * Math.min(1.3, 0.75 + inten * 0.4) * (1 - k / pts.length * 0.6);
      var nx = -(p1.y - p0.y), ny = (p1.x - p0.x);
      var nl = Math.hypot(nx, ny) || 1; nx /= nl; ny /= nl;
      var x0 = px(p0.x), y0 = py(p0.y), x1 = px(p1.x), y1 = py(p1.y);
      var hot = inten >= 1.4;
      ctx.globalAlpha = 0.06 + inten * 0.1;
      ctx.fillStyle = hot ? "#fff6d8" : "#ffe9a8";
      ctx.beginPath();
      ctx.moveTo(x0 + nx * w0, y0 + ny * w0);
      ctx.lineTo(x1 + nx * w0 * 0.4, y1 + ny * w0 * 0.4);
      ctx.lineTo(x1 - nx * w0 * 0.4, y1 - ny * w0 * 0.4);
      ctx.lineTo(x0 - nx * w0, y0 - ny * w0);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = hot ? "rgba(255,250,225,0.9)" : "rgba(255,236,170,0.8)";
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
    // 光束端点辉光
    var last = pts[pts.length - 1];
    var gr = ctx.createRadialGradient(px(last.x), py(last.y), 0, px(last.x), py(last.y), 16);
    gr.addColorStop(0, "rgba(255,240,190,0.5)"); gr.addColorStop(1, "rgba(255,240,190,0)");
    ctx.globalAlpha = Math.min(1, last.i);
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(px(last.x), py(last.y), 16, 0, 6.283); ctx.fill();
    ctx.globalAlpha = 1;
  }
}
function drawLighthouse(t) {
  var lx = px(st.lh[0] + 0.5), ly = py(st.lh[1] + 0.5);
  // 礁岛
  ctx.fillStyle = "#1b2438";
  ctx.beginPath(); ctx.ellipse(lx, ly + 6, 30, 40, 0, 0, 6.283); ctx.fill();
  ctx.strokeStyle = "rgba(160,180,210,0.25)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(lx, ly + 6, 30, 40, 0, 0, 6.283); ctx.stroke();
  // 灯塔光晕
  var glow = ctx.createRadialGradient(lx, ly, 2, lx, ly, 42);
  glow.addColorStop(0, "rgba(255,236,170,0.5)"); glow.addColorStop(1, "rgba(255,236,170,0)");
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(lx, ly, 42, 0, 6.283); ctx.fill();
  // 塔身（红白条纹）
  ctx.save();
  ctx.translate(lx, ly);
  for (var i = 0; i < 4; i++) {
    ctx.fillStyle = i % 2 ? "#e8e4da" : "#c8452e";
    ctx.fillRect(-6, 8 - i * 9, 12, 9);
  }
  ctx.fillStyle = "#2a2f3e";
  ctx.fillRect(-8, -30, 16, 5);
  ctx.fillStyle = "#ffe9a8";
  ctx.beginPath(); ctx.arc(0, -27.5, 3.5, 0, 6.283); ctx.fill();
  ctx.restore();
  // 指向角标
  var a = st.angle * Math.PI / 180;
  ctx.strokeStyle = "rgba(255,233,168,0.85)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(lx, ly - 27.5);
  ctx.lineTo(lx + Math.cos(a) * 14, ly - 27.5 + Math.sin(a) * 14); ctx.stroke();
}
function drawReefs(t) {
  for (var i = 0; i < st.clusters.length; i++) {
    var cl = st.clusters[i];
    for (var k = 0; k < cl.cells.length; k++) {
      var cc = cl.cells[k];
      var cx0 = px(cc.c + 0.5), cy0 = py(cc.r + 0.5);
      // 海图标记线（未显形：虚线警示圈）
      ctx.save();
      ctx.setLineDash([3, 3]);
      ctx.strokeStyle = cl.revealed ? "rgba(255,255,255,0.1)" : "rgba(255,120,90,0.45)";
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(cx0, cy0, 9, 0, 6.283); ctx.stroke();
      ctx.restore();
      if (!cl.revealed && cl.exposure > 0.05) {
        // 受光中：渐亮预览
        ctx.globalAlpha = Math.min(0.8, cl.exposure);
        ctx.fillStyle = "#5a6478";
        ctx.beginPath(); ctx.arc(cx0, cy0, 7, 0, 6.283); ctx.fill();
        ctx.globalAlpha = 1;
      }
      if (cl.revealed) {
        // 显形礁石
        ctx.fillStyle = "#4a5568";
        ctx.strokeStyle = "rgba(190,205,230,0.7)"; ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(cx0 - 9, cy0 + 4);
        ctx.lineTo(cx0 - 4, cy0 - 7); ctx.lineTo(cx0 + 2, cy0 - 3);
        ctx.lineTo(cx0 + 8, cy0 - 8); ctx.lineTo(cx0 + 10, cy0 + 5);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        if (cl.ripple > 0) {
          ctx.globalAlpha = cl.ripple;
          ctx.strokeStyle = "#bfe0ff"; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(cx0, cy0, 9 + (1 - cl.ripple) * 22, 0, 6.283); ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }
    }
  }
}
function drawSlots() {
  var slots = st.L.slots || [];
  for (var s = 0; s < slots.length; s++) {
    var cx0 = px(slots[s][0] + 0.5), cy0 = py(slots[s][1] + 0.5);
    var d = LK.devAt(st, s);
    if (!d) {
      ctx.save();
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = "rgba(140,220,255,0.5)"; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(cx0, cy0, 12, 0, 6.283); ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = "rgba(140,220,255,0.5)";
      ctx.beginPath();
      ctx.moveTo(cx0 - 5, cy0); ctx.lineTo(cx0 + 5, cy0);
      ctx.moveTo(cx0, cy0 - 5); ctx.lineTo(cx0, cy0 + 5);
      ctx.stroke();
    } else drawDevice(d.type, cx0, cy0, 1);
  }
}
function drawDevice(type, x, y, scale) {
  ctx.save(); ctx.translate(x, y); ctx.scale(scale || 1, scale || 1);
  if (type === "P") {
    // 棱镜：三角
    ctx.shadowColor = "rgba(150,220,255,0.9)"; ctx.shadowBlur = 8;
    ctx.fillStyle = "rgba(190,235,255,0.95)";
    ctx.beginPath();
    ctx.moveTo(0, -10); ctx.lineTo(9, 7); ctx.lineTo(-9, 7);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#5fb8ff"; ctx.lineWidth = 1.5; ctx.stroke();
  } else {
    // 透镜：椭圆环
    ctx.shadowColor = "rgba(255,220,140,0.9)"; ctx.shadowBlur = 8;
    ctx.strokeStyle = "rgba(255,224,150,0.95)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(0, 0, 6, 11, 0, 0, 6.283); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,240,200,0.6)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(0, 0, 2.5, 8, 0, 0, 6.283); ctx.stroke();
  }
  ctx.restore();
}
function drawShips(t) {
  var colors = ["#6ee7a0", "#7cb8ff", "#ffb27c"];
  for (var i = 0; i < st.ships.length; i++) {
    var sh = st.ships[i];
    var pos = LK.shipXY(sh, st.t);
    var sx = px(pos.x), sy = py(pos.y);
    var ang = Math.atan2(sh.dir[1], sh.dir[0]);
    // 尾迹
    ctx.save();
    ctx.translate(sx, sy); ctx.rotate(ang);
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = "#cfe6ff";
    ctx.beginPath();
    ctx.moveTo(-10, 0); ctx.lineTo(-26, -5 - Math.sin(t * 3 + i) * 2); ctx.lineTo(-26, 5 + Math.sin(t * 3 + i) * 2);
    ctx.closePath(); ctx.fill();
    // 船体
    ctx.globalAlpha = 1;
    ctx.shadowColor = colors[i % 3]; ctx.shadowBlur = 8;
    ctx.fillStyle = sh.dead ? "#5a3038" : colors[i % 3];
    ctx.beginPath();
    ctx.moveTo(13, 0); ctx.lineTo(-7, -8); ctx.lineTo(-11, 0); ctx.lineTo(-7, 8);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(10,20,40,0.85)";
    ctx.fillRect(-5, -4, 7, 8);
    ctx.fillStyle = "#fff8d8";
    ctx.fillRect(2, -2, 5, 4);
    // 船灯
    ctx.fillStyle = "#fff2b0";
    ctx.beginPath(); ctx.arc(11, 0, 2, 0, 6.283); ctx.fill();
    ctx.restore();
    // 血量点
    for (var h = 0; h < 2; h++) {
      ctx.fillStyle = h < sh.hull ? "#7dffa8" : "rgba(255,255,255,0.15)";
      ctx.beginPath(); ctx.arc(sx - 6 + h * 9, sy + 15, 2.6, 0, 6.283); ctx.fill();
    }
    if (sh.docked) {
      ctx.fillStyle = "rgba(190,255,210,0.9)"; ctx.font = "700 11px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("IN PORT", sx, sy - 16);
    }
  }
  // 港口
  for (var j = 0; j < st.ships.length; j++) {
    var B = st.ships[j].B;
    var bx = px(B[0] + 0.5), by = py(B[1] + 0.5);
    ctx.strokeStyle = "rgba(140,255,180,0.5)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx, by, 12 + Math.sin(t * 2.4 + j) * 2, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(bx, by, 12 + Math.sin(t * 2.4 + j) * 2, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
  }
}
function drawTray() {
  ctx.fillStyle = "#0b1024";
  ctx.fillRect(0, TRAY_Y, W, H - TRAY_Y);
  ctx.strokeStyle = "rgba(120,150,220,0.2)";
  ctx.beginPath(); ctx.moveTo(0, TRAY_Y); ctx.lineTo(W, TRAY_Y); ctx.stroke();
  ctx.fillStyle = "rgba(160,180,220,0.55)";
  ctx.font = "10px sans-serif"; ctx.textAlign = "left";
  ctx.fillText("DEVICES — drag onto a dashed slot", 12, TRAY_Y + 14);
  var x = 26;
  for (var i = 0; i < st.tray.length; i++) {
    var d = st.tray[i];
    if (d.slot >= 0) continue;
    if (carry === i && carryPos) continue;
    drawDevice(d.type, x, TRAY_Y + 34, 1.1);
    x += 54;
  }
  if (carry >= 0 && carryPos) drawDevice(st.tray[carry].type, carryPos.x, carryPos.y, 1.25);
  // 拍指示
  var bt = st.t / LK.BEAT;
  var frac = bt - Math.floor(bt);
  ctx.fillStyle = "rgba(150,180,255,0.9)";
  ctx.font = "700 11px sans-serif"; ctx.textAlign = "right";
  ctx.fillText("BEAT " + Math.min(st.beat + 1, st.L.beats) + " / " + st.L.beats, W - 14, TRAY_Y + 14);
  ctx.fillStyle = "rgba(120,150,220,0.35)";
  ctx.fillRect(W - 90, TRAY_Y + 22, 76, 5);
  ctx.fillStyle = "rgba(160,190,255,0.9)";
  ctx.fillRect(W - 90, TRAY_Y + 22, 76 * frac, 5);
}
function render(t) {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake * 8, (Math.random() - 0.5) * shake * 8);
    shake = Math.max(0, shake - 0.02);
  }
  drawSea(t);
  if (st) {
    drawFog(t);
    drawSlots();
    drawReefs(t);
    drawBeams();
    drawLighthouse(t);
    drawShips(t);
    // 显形涟漪
    for (var i = flashReveal.length - 1; i >= 0; i--) {
      var fr = flashReveal[i]; fr.life -= 0.03;
      if (fr.life <= 0) { flashReveal.splice(i, 1); continue; }
      ctx.globalAlpha = fr.life * 0.7;
      ctx.strokeStyle = "#cfe8ff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px(fr.x), py(fr.y), (1 - fr.life) * 40 + 6, 0, 6.283); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    drawTray();
  }
  ctx.restore();
  // 外框
  ctx.strokeStyle = "rgba(90,120,190,0.25)";
  roundRect(ctx, OX - 5, OY - 5, COLS * CELL + 10, ROWS * CELL + 10, 12); ctx.stroke();
}

// ---------- 主循环（固定步长 1/30 与回放一致） ----------
var acc = 0, lastT = 0;
function frame(ts) {
  var dt = Math.min((ts - lastT) / 1000 || 0, 0.1); lastT = ts;
  if (ui === "play" && st) {
    acc += dt;
    var guard = 0;
    while (acc >= 1 / 30 && guard++ < 6) {
      acc -= 1 / 30;
      LK.step(st, 1 / 30);
    }
    consumeEvents();
    elBeat.textContent = "BEAT " + Math.min(st.beat + 1, st.L.beats) + "/" + st.L.beats;
    if (st.status !== "play") { endLevel(); acc = 0; }
  } else acc = 0;
  render(ts / 1000);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
openMenu();
// 调试/测试钩子（不影响游戏逻辑）
window.__lk = {
  LK: LK,
  get state() { return st; },
  get ui() { return ui; },
  start: startLevel
};

</script>
</body>
